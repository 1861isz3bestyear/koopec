name: CI
on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov --workspace --summary-only --fail-under-lines 95.01
  python-extension:
    name: Python extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install pytest
      - run: PYO3_PYTHON="$(command -v python)" ./python/tests/run-native.sh
  calculator:
    name: Calculator Python and Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - name: Install locked Python and Chromium dependencies
        id: calculator_setup
        run: |
          uv sync --locked
          uv run --locked playwright install --with-deps chromium
      - name: Run Python and browser suite
        run: ./streamlit_calculator/test.sh
      - name: Check Python formatting, lint and types
        if: always() && steps.calculator_setup.outcome == 'success'
        run: |
          uv run --locked black --check .
          uv run --locked ruff check .
          uv run --locked basedpyright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calculator-browser-results
          path: streamlit_calculator/test-results/
          if-no-files-found: warn
